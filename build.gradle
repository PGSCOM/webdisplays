plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://cursemaven.com' }
    maven { url 'https://jitpack.io' }
    maven {
        name = "mcef-download"
        url = uri("https://maven.cinemamod.com")
        content { includeGroup("com.cinemamod") }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
// Añadimos fuentes "solo para compilar" (stubs) y las excluimos del artefacto final
sourceSets.main.java.srcDir 'src/compileOnly/java'

configurations {
    // For dependencies needed only at runtime in dev
    localRuntime
}

dependencies {
    // NeoForge platform
    implementation "net.neoforged:neoforge:${neo_version}"

    // Mixin processor
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Project dependencies
    implementation "com.cinemamod:mcef-forge:2.1.1-1.21.1"
    // Spark profiler (1.21.1 compatible) desde CurseMaven: https://www.curseforge.com/minecraft/mc-mods/spark/files/5622205
    localRuntime 'curse.maven:spark-361579:5622205' // Spark profiler at runtime only
    // Vivecraft (NeoForge) para 1.21.x — CurseForge project 667903, file 7129676
    // Referencia: https://www.curseforge.com/minecraft/mc-mods/vivecraft/files/7129676
    compileOnly 'curse.maven:vivecraft-667903:7129676'
    // Y disponible en runtime para ejecuciones de desarrollo
    runtimeOnly 'curse.maven:vivecraft-667903:7129676'
}

// Sustitución: si no se puede resolver com.cinemamod:mcef-forge, usa el artefacto de CurseMaven equivalente para NeoForge 1.21.1
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.cinemamod:mcef-forge:2.1.1-1.21.1') using module('curse.maven:mcef-636236:5828243')
        // Vivecraft se fija directamente al fileId 7129676, así que no es necesaria sustitución adicional
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // Generate Mixin refmap without mixingradle
    options.compilerArgs += ["-AoutRefMap=webdisplays.refmap.json"]
}

// Asegura que las dependencias de solo runtime locales se agreguen al classpath de ejecucion
configurations {
    runtimeClasspath.extendsFrom(localRuntime)
}

runs {
    client {
        workingDirectory project.file('run/client')
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        arguments.addAll '--username', 'Player'
        jvmArguments.addAll '-Xmx4G', '-Xms2G', '-XX:+UseG1GC', '-XX:+ParallelRefProcEnabled', '-XX:MaxGCPauseMillis=200', '-XX:+UnlockExperimentalVMOptions', '-XX:+DisableExplicitGC', '-XX:G1HeapRegionSize=32M', '-mixin.config=webdisplays.mixins.json'
    }
    server {
        workingDirectory project.file('run/server')
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        arguments.addAll '--nogui'
        jvmArguments.addAll '-Xmx3G', '-Xms1G', '-XX:+UseG1GC', '-mixin.config=webdisplays.mixins.json'
    }
    gameTestServer {
        workingDirectory project.file('run/gametest')
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        jvmArguments.addAll '-Xmx2G', '-Xms512M', '-mixin.config=webdisplays.mixins.json'
    }
    data {
        workingDirectory project.file('run/data')
        arguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': 'montoyo',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'montoyo',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'webdisplays.mixins.json'
        )
    }
    // Evitar empaquetar clases stub usadas solo para compilar contra Vivecraft
    exclude('org/vivecraft/**')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { // use NeoForge toml
        expand(
            'version': project.version,
            'mod_id': mod_id,
            'mod_name': mod_name,
            'mod_authors': mod_authors,
            'mod_description': mod_description,
            'minecraft_version': minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'neo_version': neo_version,
            'neo_version_range': neo_version_range,
            'loader_version_range': loader_version_range
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

