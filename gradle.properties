# Ajustes de Gradle (memoria y rendimiento)
# Memoria para el daemon de Gradle. Aumenta si tu máquina lo permite.
# Nota: esto afecta SOLO a Gradle, no a la JVM de ejecución del juego.
org.gradle.jvmargs = -Xmx6G -Xms2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Opcionales para acelerar builds (puedes desactivar si algo da problemas)
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true
# La caché de configuración suele ser estable con Gradle 8.13+, pero si ves
# errores de configuración, prueba a ponerlo en false.
org.gradle.configuration-cache = true

# Mod coordinates and metadata
mod_version = 2.0.2-1.21.1
maven_group = com.cinemamod
archives_base_name = webdisplays

# NeoGradle 7 MDK-style properties
mod_group_id = com.cinemamod
mod_id = webdisplays
mod_name = WebDisplays
mod_authors = montoyo, CinemaMod Group
mod_description = WebDisplays brings web browsing into Minecraft with in-game screens and peripherals.

# Minecraft / NeoForge versions and ranges
minecraft_version = 1.21.1
neo_version = 21.1.213
loader_version_range = [1,)
minecraft_version_range = [1.21.1]
neo_version_range = [21.1,)

# Parchment subsystem (optional)
# neogradle.subsystems.parchment.minecraftVersion=1.21.1
# neogradle.subsystems.parchment.mappingsVersion=

# NeoGradle performance tuning (lower memory to avoid OOM in constrained envs)
neogradle.subsystems.decompiler.maxMemory=1g
neogradle.subsystems.decompiler.maxThreads=1